<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Night Tools</title>
<meta name="description" content="Handy tools for game night.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#fff3e2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1528" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Shelf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff3e2; --surface: #fffdf8; --surface-2: #fdeedb; --ink: #3d2a4f; --ink-2: #6b5878; --muted: #9b8aa5;
    --line: #efdcc2; --outline: #3d2a4f; --accent: #ff7a5a; --accent-ink: #ffffff; --accent-soft: #ffe2d8;
    --yellow: #ffd45c; --yellow-soft: #fff1c2; --mint: #8be0bd; --mint-soft: #ddf6ea;
    --ok: #24a26b; --danger: #d43c41; --warn: #a35a00; --warn-soft: #ffe8cc;
    --edge: 2.5px solid var(--outline); --pop: 4px 4px 0 var(--outline); --pop-sm: 3px 3px 0 var(--outline);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1528; --surface: #2a2039; --surface-2: #342846; --ink: #fff3e2; --ink-2: #d8c8e0; --muted: #a795b3;
      --line: #46375a; --outline: #0c0714; --accent: #ff8f73; --accent-ink: #1c1528; --accent-soft: #4a2b2a;
      --yellow-soft: #4a3d1e; --mint-soft: #1f3d33; --ok: #6fd3ac; --danger: #ff8a80; --warn: #ffb36b; --warn-soft: #4a321c; --hl: #6b44c9;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1528; --surface: #2a2039; --surface-2: #342846; --ink: #fff3e2; --ink-2: #d8c8e0; --muted: #a795b3;
    --line: #46375a; --outline: #0c0714; --accent: #ff8f73; --accent-ink: #1c1528; --accent-soft: #4a2b2a;
    --yellow-soft: #4a3d1e; --mint-soft: #1f3d33; --ok: #6fd3ac; --danger: #ff8a80; --warn: #ffb36b; --warn-soft: #4a321c; --hl: #6b44c9;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; color: var(--ink); font: 16px/1.5 Nunito, ui-rounded, ui-sans-serif, system-ui, sans-serif;
    background-color: var(--bg); background-image: radial-gradient(circle, color-mix(in srgb, var(--outline) 9%, transparent) 1.3px, transparent 1.7px); background-size: 22px 22px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

  /* Header (matches the other pages) */
  header.top { padding: 36px 0 8px; }
  .titlebar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  .brand { display: flex; align-items: center; gap: 16px; color: inherit; text-decoration: none; }
  .logo { width: 72px; height: 72px; flex: none; transform: rotate(-5deg); filter: drop-shadow(4px 4px 0 var(--outline)); transition: transform .3s; }
  .logo:hover { transform: rotate(4deg) scale(1.05); }
  h1 { font: 700 clamp(2rem, 4vw, 2.9rem)/1.05 Fredoka, ui-rounded, system-ui, sans-serif; margin: 0; letter-spacing: -0.01em; }
  h1 .hl { background: linear-gradient(transparent 62%, var(--hl, var(--yellow)) 62% 92%, transparent 92%); padding: 0 2px; }
  .tagline { margin: 6px 0 0; color: var(--ink-2); font-size: 1.05rem; font-weight: 600; }
  .pagenav { display: inline-flex; gap: 4px; padding: 3px; background: var(--surface); border: var(--edge); border-radius: 14px; box-shadow: var(--pop-sm); }
  .pagenav a { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 10px; font: 600 .98rem Fredoka, ui-rounded, sans-serif; color: var(--ink-2); text-decoration: none; }
  .pagenav a:hover { color: var(--ink); background: var(--surface-2); }
  .pagenav a[aria-current="page"] { background: var(--yellow); color: #3d2a4f; box-shadow: inset 0 0 0 2px var(--outline); }


  /* The hub: three stops on a game night, each a section of tool cards. To add a tool: put its page in
     /tools and add it to the right section in SECTIONS below (or swap it in for one of that section's ideas). */
  .hubintro { margin-top: 26px; display: grid; gap: 14px; }
  .hubintro p { margin: 0; color: var(--ink-2); font-weight: 600; font-size: 1.05rem; max-width: 64ch; }
  .jump { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin: 0; padding: 0; }
  .jump a { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 14px 0 6px; border: var(--edge); border-radius: 999px; background: var(--surface);
    box-shadow: var(--pop-sm); color: var(--ink); text-decoration: none; font: 600 1rem Fredoka, ui-rounded, sans-serif; transition: transform .12s; }
  .jump a:hover, .jump a:focus-visible { transform: translate(-2px, -2px); }
  .jump .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--outline); background: var(--sc); color: #3d2a4f; font-weight: 700; }
  .jump small { color: var(--muted); font: 700 .8rem Nunito, sans-serif; }
  .stop { position: relative; margin-top: 34px; padding-left: 74px; scroll-margin-top: 16px; }
  .stop::before { content: ""; position: absolute; left: 27px; top: 60px; bottom: -34px; border-left: 4px dotted var(--line); }
  .stop:last-of-type::before { display: none; }
  .stophead { display: flex; gap: 14px; align-items: center; margin: 0 0 16px -74px; }
  .token { width: 58px; height: 58px; flex: none; border-radius: 50%; display: grid; place-items: center; border: var(--edge); background: var(--sc); box-shadow: var(--pop-sm);
    font-size: 1.6rem; position: relative; z-index: 1; }
  .token b { position: absolute; right: -6px; top: -6px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--outline);
    font: 700 .8rem Fredoka, ui-rounded, sans-serif; color: var(--ink); }
  .stophead h2 { margin: 0; font: 700 1.6rem/1.15 Fredoka, ui-rounded, sans-serif; }
  .stophead p { margin: 2px 0 0; color: var(--ink-2); font-weight: 600; }
  .tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; align-items: stretch; }
  .tool { display: flex; flex-direction: column; gap: 10px; padding: 20px; background: var(--surface); border: var(--edge); border-radius: 22px; box-shadow: var(--pop);
    color: inherit; text-decoration: none; transition: transform .16s, box-shadow .16s; }
  a.tool:hover, a.tool:focus-visible { transform: translate(-3px, -3px) rotate(-.6deg); box-shadow: 7px 7px 0 var(--outline); }
  .tool .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .tool .icon { width: 60px; height: 60px; border: var(--edge); border-radius: 18px; display: grid; place-items: center; font-size: 1.9rem; box-shadow: var(--pop-sm); transform: rotate(-5deg); }
  .tool .where { font: 700 .75rem Nunito, sans-serif; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); border: 2px solid var(--line); border-radius: 999px; padding: 2px 9px; }
  .tool h3 { margin: 2px 0 0; font: 700 1.3rem/1.2 Fredoka, ui-rounded, sans-serif; }
  .tool p { margin: 0; color: var(--ink-2); font-weight: 600; flex: 1; }
  .tool .go { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border: var(--edge); border-radius: 12px; background: var(--yellow); color: #3d2a4f;
    box-shadow: var(--pop-sm); font: 600 .98rem Fredoka, ui-rounded, sans-serif; }
  .ideas { display: flex; flex-direction: column; gap: 14px; }
  .tool.idea { border-style: dashed; box-shadow: none; background: transparent; padding: 16px; gap: 6px; }
  .tool.idea .icon { width: 44px; height: 44px; font-size: 1.3rem; border-radius: 14px; box-shadow: none; border-style: dashed; background: transparent; transform: none; }
  .tool.idea h3 { font-size: 1.1rem; } .tool.idea p { font-size: .92rem; }
  .tool.idea .where { border-style: dashed; }
  footer { margin: 48px 0 0; padding: 24px 0 40px; border-top: 2.5px dashed var(--line); color: var(--muted); font-size: .88rem; font-weight: 600; }
  @media (max-width: 760px) {
    .wrap { padding: 0 16px; } header.top { padding-top: 24px; } .logo { width: 54px; height: 54px; } .brand { gap: 12px; }
    .tool { box-shadow: var(--pop-sm); }
    .stop { padding-left: 0; } .stop::before { display: none; } .stophead { margin-left: 0; } .token { width: 50px; height: 50px; font-size: 1.4rem; }
    .stophead h2 { font-size: 1.35rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titlebar">
      <a class="brand" href="/">
        <svg class="logo" viewBox="0 0 72 72" aria-hidden="true">
          <rect x="3" y="3" width="66" height="66" rx="18" fill="var(--yellow)" stroke="var(--outline)" stroke-width="3"/>
          <g transform="translate(36 10) rotate(14)"><rect x="0" y="0" width="22" height="22" rx="5" fill="#fff" stroke="var(--outline)" stroke-width="2.5"/>
            <circle cx="6" cy="6" r="2.2" fill="var(--outline)"/><circle cx="11" cy="11" r="2.2" fill="var(--outline)"/><circle cx="16" cy="16" r="2.2" fill="var(--outline)"/></g>
          <g transform="translate(9 20) scale(1.75)"><path d="M12 2.6a3.3 3.3 0 0 1 3.3 3.3c0 1-.4 1.8-1.1 2.4 2.7.5 6.5 1.7 6.5 3.5 0 1.1-1.5 1.6-3.3 1.4l2.3 6.6c.3.8-.3 1.6-1.1 1.6h-3.3L12 16.3l-3.3 5.1H5.4c-.8 0-1.4-.8-1.1-1.6l2.3-6.6c-1.8.2-3.3-.3-3.3-1.4 0-1.8 3.8-3 6.5-3.5-.7-.6-1.1-1.4-1.1-2.4A3.3 3.3 0 0 1 12 2.6Z" fill="var(--accent)" stroke="var(--outline)" stroke-width="1.4" stroke-linejoin="round"/></g>
        </svg>
        <div>
          <h1>Our Game <span class="hl">Shelf</span></h1>
          <p class="tagline">Handy tools for game night.</p>
        </div>
      </a>
      <nav class="pagenav" aria-label="Pages"><a href="/">Games</a><a href="/stats">Charts</a><a href="/tools" aria-current="page">Tools</a></nav>
    </div>
  </header>
  <main>
    <section class="hubintro" aria-label="About these tools">
      <p>Little helpers for every part of game night: picking what to play, running the game at the table, and looking back afterwards.</p>
      <ul class="jump" id="jump"></ul>
    </section>
    <div id="stops"></div>
  </main>
  <footer>Dashed cards are ideas for tools we might add next.</footer>
</div>
<script>
// The Tools hub: three stops on a game night. Add a tool to the section where it's used (and its page under
// /tools); ideas are dashed placeholders, so swap one out when its tool is built.
const SECTIONS = [
  { id: "before", icon: "🗓️", color: "var(--mint)", name: "Before you play", note: "Decide what to play, and who it's for.",
    tools: [
      { href: "/tools/quiz", icon: "🧠", color: "#d6c4ff", name: "Gamer personality quiz",
        text: "Are you a Strategist, Tactician, Social Gamer, Explorer, Competitor or Collector? Ten quick questions, then the games on our shelf that suit you." },
      { href: "/tools/game-night", icon: "🍿", color: "var(--mint-soft)", name: "Game night planner",
        text: "Plan a game night together: invite people with a link, find a time that works, rate what everyone likes, vote on games live and build the night's schedule. Or just get quick picks for tonight." },
      { href: "/tools/compare", icon: "⚖️", color: "#9cc9ff", name: "Complexity comparator",
        text: "Put games side by side: weight, play time, how long to teach and how hard to learn, with your own ratings and similar games from the shelf." }],
    ideas: [{ icon: "📋", name: "Teach notes", text: "Short rules teach scripts for the games we bring out most." }] },
  { id: "table", icon: "🎲", color: "var(--yellow)", name: "At the table", note: "Keep the game moving once the box is open.",
    tools: [
      { href: "/tools/first-player", icon: "👆", color: "var(--yellow-soft)", name: "First player picker",
        text: "Everyone puts a finger on the phone and it picks who goes first, or the whole turn order. No touch screen? Pick from a list of names." },
      { href: "/tools/initiative", icon: "⚔️", color: "var(--accent-soft)", name: "Initiative tracker",
        text: "Roll or enter initiative, then step through turns round by round. Keep core party members and clear scenario enemies. Save several parties and share one with a code." },
      { href: "/tools/table", icon: "🧮", color: "var(--yellow-soft)", name: "Table tracker",
        text: "Action points, resources, rounds, phases and turn order, set up the way your game works: costs, refills, banking, upgrades, income and passing." },
      { href: "/tools/tournament", icon: "🏆", color: "#ffbf8f", name: "Tournament",
        text: "Single or double elimination, round robin or Swiss. Head-to-head or tables of players, teams, scores, brackets and standings." },
      { href: "/tools/goals", icon: "🎯", color: "var(--mint-soft)", name: "Personal goals",
        text: "Track personal quests step by step (checkboxes and counts). Link one to a campaign character and it flags them ready to retire when it's done." }],
    ideas: [{ icon: "⏳", name: "Turn timer", text: "A gentle chess clock for the slow thinkers at the table." }] },
  { id: "after", icon: "🏆", color: "#ffbf8f", name: "After the game", note: "Add up the score and remember the night.",
    tools: [
      { href: "/tools/campaigns", icon: "📜", color: "#d6c4ff", name: "Campaign tracker",
        text: "Scenarios and what they unlock, characters and retirement, achievements, unlocks and history. Ready-made setups for Frosthaven, Gloomhaven 2e, Jaws of the Lion, Bomb Busters and ISS Vanguard, or build your own." },
      { href: "/stats#recap", icon: "📆", color: "var(--yellow-soft)", name: "Our year recap", where: "On Charts",
        text: "Our year and each quarter at the table from Remy's logged plays: favorites, new-to-us games and fun facts." }],
    ideas: [{ icon: "🧮", name: "Score pad", text: "Add up end-game points by category for any game, with a running total per player." }] },
];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
document.getElementById("jump").innerHTML = SECTIONS.map((s, i) => `<li><a href="#${s.id}" style="--sc:${s.color}"><span class="n">${i + 1}</span>${esc(s.name)} <small>${plural(s.tools.length, "tool")}</small></a></li>`).join("");
document.getElementById("stops").innerHTML = SECTIONS.map((s, i) => `<section class="stop" id="${s.id}" aria-labelledby="${s.id}-h" style="--sc:${s.color}">
    <div class="stophead"><span class="token" aria-hidden="true">${s.icon}<b>${i + 1}</b></span><div><h2 id="${s.id}-h">${esc(s.name)}</h2><p>${esc(s.note)}</p></div></div>
    <div class="tools">${s.tools.map((t) => `<a class="tool" href="${t.href}">
      <span class="top"><span class="icon" style="background:${t.color}" aria-hidden="true">${t.icon}</span>${t.where ? `<span class="where">${esc(t.where)}</span>` : ""}</span>
      <h3>${esc(t.name)}</h3><p>${esc(t.text)}</p><span class="go">Open ›</span></a>`).join("")}
    <div class="ideas">${s.ideas.map((t) => `<div class="tool idea"><span class="top"><span class="icon" aria-hidden="true">${t.icon}</span><span class="where">Idea</span></span>
      <h3>${esc(t.name)}</h3><p>${esc(t.text)}</p></div>`).join("")}</div></div></section>`).join("");
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
