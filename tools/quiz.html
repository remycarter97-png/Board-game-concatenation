<style>

  .hero .big { font-size: 4.5rem; line-height: 1; width: 110px; height: 110px; display: grid; place-items: center; background: #fffdf8; border: 3px solid #3d2a4f; border-radius: 28px; box-shadow: 4px 4px 0 #3d2a4f; transform: rotate(-5deg); }
  .hero small { font: 600 .85rem Fredoka, ui-rounded, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
  .hero h2 { display: block; margin: 2px 0 6px; font: 700 clamp(2rem, 5vw, 3rem)/1.05 Fredoka, ui-rounded, sans-serif; }

  .art img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .minfo { min-width: 0; display: grid; gap: 3px; align-content: start; }

  .why { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .why span { font-size: .72rem; font-weight: 800; border-radius: 999px; padding: 1px 8px; border: 1.5px solid var(--outline); background: var(--mint-soft); }
  .types { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .tcard { display: grid; gap: 4px; justify-items: start; text-align: left; padding: 14px; border: var(--edge); border-radius: 18px; background: var(--tc); color: #3d2a4f; box-shadow: var(--pop-sm); font: inherit; }
  .tcard .em { font-size: 1.8rem; } .tcard b { font: 700 1.1rem Fredoka, ui-rounded, sans-serif; } .tcard span { font-size: .85rem; font-weight: 700; }
  .tcard[aria-pressed="true"] { outline: 3px solid var(--outline); outline-offset: 2px; transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--outline); }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .msg { font-weight: 700; color: var(--ink-2); font-size: .9rem; }
  h2.sec { margin: 0; font: 700 1.35rem Fredoka, ui-rounded, sans-serif; }
  footer { margin: 48px 0 0; padding: 24px 0 40px; border-top: 2.5px dashed var(--line); color: var(--muted); font-size: .88rem; font-weight: 600; }
  @media (max-width: 760px) {
    .wrap { padding: 0 16px; } header.top { padding-top: 24px; } .logo { width: 54px; height: 54px; } .brand { gap: 12px; }

  }
</style>

      ["😈", "Bring it. That's half the fun", { competitor: 3, tactician: 1 }],
      ["🤝", "I'd rather we all team up against the game", { explorer: 2, social: 1 }],
      ["🙂", "A little interaction is fine, nothing mean", { strategist: 2, collector: 1 }],
      ["🕵️", "I prefer lying to them", { social: 3 }]] },
    { q: "Pick a world to play in.", a: [
      ["🐉", "Dungeons, dragons and ancient ruins", { explorer: 3, tactician: 1 }],
      ["🚀", "Distant planets and starships", { explorer: 2, strategist: 1 }],
      ["🌻", "Gardens, birds and cozy animals", { collector: 3 }],
      ["🏰", "Building a medieval city or trade empire", { strategist: 3 }],
      ["🎲", "Doesn't matter, it's about the mechanics", { tactician: 2, competitor: 1 }],
      ["🕺", "Whatever gets people talking", { social: 3 }]] },
    { q: "Teaching the rules: how long can you sit through?", a: [
      ["🗣️", "Two minutes, then let's just play", { social: 3 }],
      ["📏", "Ten minutes is fine", { collector: 1, competitor: 2 }],
      ["📚", "Thirty minutes if the game is worth it", { strategist: 2, tactician: 1 }],
      ["📕", "I already read the rulebook. Twice.", { strategist: 1, explorer: 2 }]] },
    { q: "Someone at the table is about to win. You…", a: [
      ["🧮", "Quietly calculate if my end-game points can catch up", { strategist: 3 }],
      ["🎯", "Find the one move that blocks them", { tactician: 2, competitor: 1 }],
      ["🍿", "Cheer them on, it's been a great game", { social: 2, explorer: 1 }],
      ["🔥", "Team up with everyone else to stop them", { competitor: 3 }]] },
    { q: "A new expansion comes out for a game you like.", a: [
      ["🛒", "Already ordered. And the playmat.", { collector: 3 }],
      ["🔍", "I'll check if it adds interesting new strategies", { strategist: 2 }],
      ["📜", "New story content? I'm in", { explorer: 2 }],
      ["🤷", "I'd rather try a different game", { social: 2, competitor: 1 }]] },
    { q: "What's your ideal group size?", a: [
      ["👤", "Just me, playing solo", { strategist: 1, explorer: 1, collector: 1 }],
      ["👥", "Two players, face to face", { competitor: 2, tactician: 1 }],
      ["👨‍👩‍👧", "Three or four friends", { strategist: 1, collector: 1, explorer: 1 }],
      ["🎊", "The more the merrier", { social: 3 }]] },
    { q: "Which compliment would make your night?", a: [
      ["🧠", "\"That was a brilliant long-term plan.\"", { strategist: 3 }],
      ["🎯", "\"How did you see that move?\"", { tactician: 3 }],
      ["🥳", "\"You're the most fun person to play with.\"", { social: 3 }],
      ["🧭", "\"You made that adventure unforgettable.\"", { explorer: 3 }],
      ["👑", "\"You're unbeatable.\"", { competitor: 3 }],
      ["🖼️", "\"Your collection is gorgeous.\"", { collector: 3 }]] },
  ];

  /* ---------- Matching games to a type ---------- */
  let games = [], addons = new Map();
  const tagsOf = (g) => new Set([...(g.mechanics || []), ...(g.categories || [])]);
  const playTime = (g) => g.playTime || g.maxTime || g.minTime || 0;
  const hue = (g) => (Number(String(g.id).replace(/\D/g, "")) * 47) % 360;
  function typeScore(k, g) {
    const T = TYPES[k], tags = tagsOf(g), why = [];
    let s = 0;
    for (const m of T.mech) if (tags.has(m)) { s += 2; why.push(LABEL[m] || m); }
    for (const c of T.cat) if (tags.has(c)) { s += 1.6; why.push(c); }
    if (g.weight) s += g.weight >= T.weight[0] && g.weight <= T.weight[1] ? 1.5 : -1;
    const t = playTime(g); if (t) s += t >= T.time[0] && t <= T.time[1] ? 1 : -0.5;
    if (T.bigGroups && (g.maxPlayers || 0) >= 6) { s += 1.5; why.push(`up to ${g.maxPlayers} players`); }
    if (T.twoPlayer && ((g.bestPlayers || []).includes(2) || g.maxPlayers === 2)) { s += 1.5; why.push("great with 2"); }
    if (T.addons && addons.get(g.id)) { s += Math.min(3, addons.get(g.id)); why.push(`${addons.get(g.id)} add-on${addons.get(g.id) === 1 ? "" : "s"} on our shelf`); }
    s += Math.max(0, (g.rating || 6.5) - 6.5) * 0.8;
    return { s, why };
  }
  // A person's matches blend their types by how strongly they scored on each.
  function matchesFor(mix, n = 9) {
    const tot = KEYS.reduce((a, k) => a + mix[k], 0) || 1;
    return games.map((g) => {
      let s = 0; const why = new Set();
      for (const k of KEYS) { if (!mix[k]) continue; const r = typeScore(k, g); s += r.s * mix[k] / tot; if (mix[k] / tot >= .2) r.why.slice(0, 3).forEach((w) => why.add(w)); }
      return { g, s, why: [...why].slice(0, 4) };
    }).sort((a, b) => b.s - a.s || (b.g.rating || 0) - (a.g.rating || 0)).slice(0, n);
  }

  /* ---------- State ---------- */
  let S; try { S = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { S = null; }
  if (!S || !Array.isArray(S.answers)) S = { answers: [], step: -1, done: false, view: null };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  function tally() {
    const mix = Object.fromEntries(KEYS.map((k) => [k, 0]));
    S.answers.forEach((ai, qi) => { if (ai == null) return; for (const [k, v] of Object.entries(QUESTIONS[qi].a[ai][2])) mix[k] += v; });
    return mix;
  }

  /* ---------- Screens ---------- */
  const card = (m) => `<li class="match"><span class="art" style="--h:${hue(m.g)}">${m.g.thumbnail ? `<img src="${esc(m.g.thumbnail)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith('🎲')">` : "🎲"}</span>
    <div class="minfo"><a class="mname" href="${esc(m.g.url)}" target="_blank" rel="noopener">${esc(m.g.name)}</a>
      <div class="mfacts">${esc([m.g.minPlayers && `${m.g.minPlayers}${m.g.maxPlayers && m.g.maxPlayers !== m.g.minPlayers ? `–${m.g.maxPlayers}` : ""} players`, playTime(m.g) && `${playTime(m.g)} min`, m.g.weight && `weight ${m.g.weight.toFixed(1)}`, m.g.rating && `★ ${m.g.rating.toFixed(1)}`].filter(Boolean).join(" · "))}</div>
      ${m.why.length ? `<div class="why">${m.why.map((w) => `<span>${esc(w)}</span>`).join("")}</div>` : ""}</div></li>`;
  const typeGrid = (pressed) => `<div class="types">${KEYS.map((k) => `<button class="tcard" type="button" data-type="${k}" style="--tc:${TYPES[k].color}" aria-pressed="${pressed === k}">
      <span class="em" aria-hidden="true">${TYPES[k].em}</span><b>${TYPES[k].name}</b><span>${esc(TYPES[k].likes.slice(0, 2).join(" · "))}</span></button>`).join("")}</div>`;
  function render(focus) {
    const app = $("app");
    if (S.step < 0 && !S.done) {
      app.innerHTML = `<section class="card intro"><div><h2 class="sec">What kind of board gamer are you?</h2>
          <p>Answer ${QUESTIONS.length} quick questions to find your gamer type, then see which games on our shelf suit you best.</p></div>
          <div class="typeicons" aria-hidden="true">${KEYS.map((k) => TYPES[k].em).join("")}</div>
          <div class="btns"><button class="btn primary big" type="button" id="start">Start the quiz</button></div></section>
        <section class="card"><h2 class="sec">The six types</h2><p class="msg">Curious already? Tap a type to see its games.</p>${typeGrid(S.view)}${S.view ? typeSection(S.view) : ""}</section>`;
    } else if (!S.done) {
      const qi = S.step, Q = QUESTIONS[qi], picked = S.answers[qi];
      app.innerHTML = `<section class="card" aria-labelledby="qtext">
        <div class="qhead"><span>Question ${qi + 1} of ${QUESTIONS.length}</span><button class="link" type="button" id="quit">Start over</button></div>
        <div class="progress" aria-hidden="true"><i style="width:${(qi / QUESTIONS.length) * 100}%"></i></div>
        <h2 class="question" id="qtext">${esc(Q.q)}</h2>
        <div class="answers" role="group" aria-labelledby="qtext">${Q.a.map(([em, t], i) => `<button class="answer" type="button" data-ans="${i}" aria-pressed="${picked === i}"><span class="em" aria-hidden="true">${em}</span>${esc(t)}</button>`).join("")}</div>
        <div class="qnav">${qi ? `<button class="btn" type="button" id="back">‹ Back</button>` : "<span></span>"}${picked != null ? `<button class="btn yellow" type="button" id="next">${qi === QUESTIONS.length - 1 ? "See my result" : "Next ›"}</button>` : ""}</div></section>`;
    } else {
      const mix = tally(), tot = KEYS.reduce((a, k) => a + mix[k], 0) || 1;
      const order = [...KEYS].sort((a, b) => mix[b] - mix[a]), top = order[0], second = order[1], T = TYPES[top];
      const matches = matchesFor(mix);
      app.innerHTML = `<section class="result">
        <div class="hero" style="--tc:${T.color}"><span class="big" aria-hidden="true">${T.em}</span>
          <div><small>You are</small><h2 id="resultH">${T.name}</h2><p>${esc(T.blurb)}</p>
          ${mix[second] / tot >= .18 ? `<p style="margin-top:8px">With a streak of <b>${TYPES[second].name}</b>.</p>` : ""}
          <div class="likes">${T.likes.map((l) => `<span>${esc(l)}</span>`).join("")}</div></div></div>
        <section class="card"><h2 class="sec">Your gamer mix</h2><div class="mix">${order.map((k) => `<div class="mixrow" style="--tc:${TYPES[k].color}"><span>${TYPES[k].em} ${TYPES[k].name.replace("The ", "")}</span>
          <span class="bar" role="img" aria-label="${Math.round(100 * mix[k] / tot)}%"><i style="width:${(100 * mix[k] / tot).toFixed(1)}%"></i></span><b>${Math.round(100 * mix[k] / tot)}%</b></div>`).join("")}</div></section>
        <section class="card"><h2 class="sec">Games on our shelf for you</h2><p class="msg">Picked from our collection for your mix of types, with what makes each a match.</p>
          ${matches.length ? `<ul class="matches">${matches.map(card).join("")}</ul>` : `<p class="msg">The shelf is still loading.</p>`}</section>
        <section class="card"><h2 class="sec">Explore the other types</h2>${typeGrid(S.view)}${S.view ? typeSection(S.view) : ""}</section>
        <div class="btns"><button class="btn primary" type="button" id="retake">Take the quiz again</button><button class="btn" type="button" id="copy">Copy my result</button><span class="msg" id="copyMsg" role="status"></span></div>
      </section>`;
    }
    if (focus) document.querySelector(focus)?.focus();
  }
  function typeSection(k) {
    const T = TYPES[k], mix = Object.fromEntries(KEYS.map((x) => [x, x === k ? 1 : 0]));
    return `<div class="card" style="margin-top:14px;box-shadow:none;border-style:dashed" id="typeSec"><h2 class="sec">${T.em} ${T.name}</h2><p class="msg">${esc(T.blurb)}</p>
      <ul class="matches">${matchesFor(mix, 6).map(card).join("")}</ul></div>`;
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "start") { S.step = 0; S.answers = []; S.done = false; save(); render(".answer"); }
    else if (b.dataset.ans) { S.answers[S.step] = Number(b.dataset.ans); save();
      if (S.step < QUESTIONS.length - 1) { S.step++; save(); render(".answer"); } else render("#next"); }
    else if (b.id === "next") { if (S.step < QUESTIONS.length - 1) { S.step++; save(); render(".answer"); } else { S.done = true; S.view = null; save(); render(); scrollTo({ top: 0, behavior: "smooth" }); $("resultH")?.setAttribute("tabindex", "-1"); $("resultH")?.focus({ preventScroll: true }); } }
    else if (b.id === "back") { S.step--; save(); render(`[data-ans="${S.answers[S.step] ?? 0}"]`); }
    else if (b.id === "quit" || b.id === "retake") { S = { answers: [], step: b.id === "retake" ? 0 : -1, done: false, view: null }; save(); render(b.id === "retake" ? ".answer" : "#start"); }
    else if (b.dataset.type) { S.view = S.view === b.dataset.type ? null : b.dataset.type; save(); render(`[data-type="${b.dataset.type}"]`); }
    else if (b.id === "copy") {
      const mix = tally(), tot = KEYS.reduce((a, k) => a + mix[k], 0) || 1, order = [...KEYS].sort((a, c) => mix[c] - mix[a]);
      const text = `I'm ${TYPES[order[0]].name} ${TYPES[order[0]].em} (${order.slice(0, 3).map((k) => `${TYPES[k].name.replace("The ", "")} ${Math.round(100 * mix[k] / tot)}%`).join(", ")}). Take the quiz: ${location.origin}/tools/quiz`;
      navigator.clipboard.writeText(text).then(() => { $("copyMsg").textContent = "Copied!"; }, () => { $("copyMsg").textContent = text; });
    }
  });

  fetch("/api/collection").then((r) => r.json()).then((d) => {
    const all = d.games || [];
    games = all.filter((g) => g.type === "Base game");
    const ids = new Set(games.map((g) => g.id));
    for (const x of all) if (x.type !== "Base game") for (const l of new Set(x.links || [])) if (ids.has(l)) addons.set(l, (addons.get(l) || 0) + 1);
    render();
  }).catch(() => { $("app").innerHTML = `<section class="card"><p>Couldn't load the shelf right now. <button class="link" type="button" onclick="location.reload()">Try again</button></p></section>`; });
})();
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
