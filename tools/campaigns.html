        <div class="row"><input type="text" id="listLabel" maxlength="40" placeholder="New list, e.g. Story flags" aria-label="New list name"><button class="btn sm" type="button" id="addList">Add list</button></div>
        <h3 class="sub2">Kinds of unlocks</h3><input type="text" data-cset="unlockKinds" value="${esc(sc.unlockKinds.join(", "))}" aria-label="Kinds of unlocks, comma-separated" style="width:100%;box-sizing:border-box">
        <label class="chk" style="margin-top:8px;width:max-content"><input type="checkbox" id="retOn"${sc.retirement !== false ? " checked" : ""}> ${esc(W("character"))}s can be marked “${esc(W("retiredOne").toLowerCase())}”</label>
        <label class="chk" style="margin-top:8px;width:max-content"><input type="checkbox" id="goalsOn"${hasGoals() ? " checked" : ""}> Personal goals</label>
        <p class="note">Removing a field hides it; anything already entered stays saved.</p>
        <div class="row"><input type="text" id="tplName" maxlength="40" placeholder="Template name" value="${esc(C.game || C.name)}" aria-label="Template name"><button class="btn sm" type="button" id="saveTpl">Save as a template</button></div></section>
      <section class="card"><h2 class="sec">Export</h2><div class="row"><button class="btn sm" type="button" id="export">Download a copy (.json)</button>
        ${confirmDel ? `<span class="note">Delete this campaign from this device?</span><button class="btn sm primary" type="button" id="delYes">Delete</button><button class="link" type="button" id="delNo">Keep it</button>` : `<button class="link danger" type="button" id="delCamp">Delete campaign</button>`}</div></section>`;
  }

  /* ---------- Actions ---------- */
  const num = (v, lo, hi) => { let n = Math.round(Number(v) || 0); if (lo != null) n = Math.max(lo, n); if (hi != null) n = Math.min(hi, n); return n; };
  function setNum(key, v, rer = true) {
    const p = key.split(":");
    if (p[0] === "tr") { const t = C.schema.sections.flatMap((s) => s.items || []).find((x) => x.id === p[1]); C.tracks[p[1]] = num(v, t?.min, t?.max); }
    else if (p[0] === "res") { (C.res[p[1]] = C.res[p[1]] || {})[p[2]] = num(v, 0); }
    else if (p[0] === "cf") { const ch = C.characters.find((x) => x.id === p[1]), f = C.schema.charFields.find((x) => x.id === p[2]); ch.fields = ch.fields || {};
      if (p[3] != null) { ch.fields[f.id] = { ...(ch.fields[f.id] || {}), [p[3]]: num(v, 0) }; } else ch.fields[f.id] = num(v, f.min ?? 0, f.max); }
    else if (p[0] === "bl") { const b = listOf(C.schema.sections.find((x) => x.id === p[1])).find((x) => x.id === p[2]); b.level = num(v, 0, 9); }
    save(rer);
  }
  function getNum(key) {
    const p = key.split(":");
    if (p[0] === "tr") return C.tracks[p[1]] || 0;
    if (p[0] === "res") return C.res[p[1]]?.[p[2]] || 0;
    if (p[0] === "cf") { const ch = C.characters.find((x) => x.id === p[1]); return p[3] != null ? ch.fields?.[p[2]]?.[p[3]] || 0 : Number(fieldVal(ch, C.schema.charFields.find((x) => x.id === p[2]))) || 0; }
    if (p[0] === "bl") return listOf(C.schema.sections.find((x) => x.id === p[1])).find((x) => x.id === p[2]).level;
  }
  function savePlay(sid) {
    const s = C.scenarios.find((x) => x.id === sid), result = $("pResult").value;
    const play = { id: uid("p"), scen: sid, date: $("pDate").value || today(), result, level: $("pLevel").value === "" ? null : Number($("pLevel").value),
      party: [...document.querySelectorAll("[data-pparty]:checked")].map((x) => x.dataset.pparty), notes: $("pNotes").value.trim() };
    C.plays.push(play);
    const cap = rotSec() && rotation(); if (cap) play.lead = cap.name;
    addLog(C, `${result === "win" ? "Won" : "Lost"} ${W("scenario").toLowerCase()} ${s.num}${s.name ? ` (${s.name})` : ""}${cap ? ` (${rotSec().label.toLowerCase()}: ${cap.name})` : ""}`);
    if (cap) C.rotation = (C.rotation || 0) + 1; // the lead passes on after every attempt
    for (const el of document.querySelectorAll("[data-pach]:checked")) { const a = C.achievements.find((x) => x.id === el.dataset.pach); a.done = true; a.date = play.date; addLog(C, `Achievement: ${a.name}`); }
    const na = $("pNewAch")?.value.trim(); if (na) { C.achievements.push({ id: uid("a"), list: $("pNewAchList").value, name: na, done: true, date: play.date }); addLog(C, `Achievement: ${na}`); }
    const un = $("pUnlockName").value.trim(); if (un) { C.unlocks.push({ id: uid("u"), kind: $("pUnlockKind").value, name: un, from: `${W("scenario")} ${s.num}`, date: play.date }); addLog(C, `Unlocked ${$("pUnlockKind").value.toLowerCase()}: ${un}`); }
    if (result === "win") {
      s.status = "done";
      for (const n of s.unlocks || []) { let t = scenByNum(C, n); if (!t) { t = { id: uid("s"), num: n, name: "", status: "available", unlocks: [], requires: [] }; C.scenarios.push(t); addLog(C, `${W("scenario")} ${n} unlocked`); } else if (t.status === "locked") { t.status = "available"; addLog(C, `${W("scenario")} ${n} unlocked`); } }
    }
    playFor = null; save();
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset;

    if (b.id === "create") { const t = T[pick] || DB.templates[pick] || T.blank; const c = blankCampaign(t, $("newName").value.trim() || ($("newGame").value.trim() || t.name), $("newGame").value.trim());
      DB.campaigns[c.id] = c; persist(); location.href = `/tools/campaigns?c=${encodeURIComponent(c.id)}#party`; return; }
    if (b.id === "openBtn") return openCode($("openCode").value);
    if (!C) return;
    if (d.tab) { tab = d.tab; history.replaceState(null, "", `#${tab}`); render(); document.querySelector(`[data-tab="${tab}"]`)?.focus(); scrollTo({ top: 0 }); }
    else if (d.step) { const [k, dir] = [d.step.slice(0, d.step.lastIndexOf(":")), Number(d.step.slice(d.step.lastIndexOf(":") + 1))]; setNum(k, getNum(k) + dir); document.querySelector(`[data-step="${d.step}"]`)?.focus({ preventScroll: true }); }
    else if (d.box) { const p = d.box.split(":"), ch = C.characters.find((x) => x.id === p[1]), i = Number(p[3]); ch.fields = ch.fields || {}; const on = (ch.fields[p[2]] || []).length;
      ch.fields[p[2]] = Array.from({ length: i + 1 === on ? i : i + 1 }, () => 1); save(); }
    // scenarios
    else if (b.id === "addScen") { const n = $("sNum").value.trim(); if (!n) return $("sNum").focus(); if (scenByNum(C, n)) { msg = ""; $("sNum").setCustomValidity("Already added"); $("sNum").reportValidity(); $("sNum").setCustomValidity(""); return; }
      C.scenarios.push({ id: uid("s"), num: n, name: $("sName").value.trim(), status: $("sStatus").value, unlocks: [], requires: [] }); addLog(C, `${W("scenario")} ${n} added`); save(); $("sNum").focus(); }
    else if (b.id === "addRange") { const a = num($("rFrom").value, 0, 999), z = num($("rTo").value, 0, 999); if (!$("rFrom").value || !$("rTo").value || z < a || z - a > 200) return $("rFrom").focus();
      let added = 0; for (let k = a; k <= z; k++) if (!scenByNum(C, k)) { C.scenarios.push({ id: uid("s"), num: String(k), name: "", status: $("rStatus").value, unlocks: [], requires: [] }); added++; }
      if (added) addLog(C, `${W("scenarios")} ${a}–${z} added`); save(); }
    else if (d.sfilter) { sFilter = d.sfilter; render(); }
    else if (d.playform) { playFor = d.playform; render(); $("pResult")?.focus(); }
    else if (d.cancelplay) { playFor = null; render(); }
    else if (d.saveplay) savePlay(d.saveplay);
    else if (d.unplay) { C.plays = C.plays.filter((p) => p.id !== d.unplay); save(); }
    else if (d.delscen) { C.scenarios = C.scenarios.filter((s) => s.id !== d.delscen); C.plays = C.plays.filter((p) => p.scen !== d.delscen); save(); }
    else if (d.addreq) { const a = document.querySelector(`[data-reqach="${d.addreq}"]`).value; if (!a) return; const s = C.scenarios.find((x) => x.id === d.addreq); s.requires = [...(s.requires || []), { ach: a, need: document.querySelector(`[data-reqneed="${d.addreq}"]`).value === "1" }]; save(); }
    else if (d.unreq) { const [sid, i] = d.unreq.split(":"); C.scenarios.find((x) => x.id === sid).requires.splice(Number(i), 1); save(); }
    // party
    else if (b.id === "addChar") { const n = $("chName").value.trim(); if (!n) return $("chName").focus(); const ch = { id: uid("h"), name: n, cls: $("chClass")?.value.trim() || "", player: $("chPlayer")?.value.trim() || "", status: "active", joined: today(), fields: {} };
      C.characters.push(ch); addLog(C, `${n}${ch.cls ? ` the ${ch.cls}` : ""} joined the ${W("party").toLowerCase()}`); save(); $("chName").focus(); }
    else if (d.bench) { const ch = C.characters.find((x) => x.id === d.bench); ch.status = ch.status === "active" ? "benched" : "active"; save(); }
    else if (d.askretire) { retiring = d.askretire; render(); $("rKind")?.focus(); }
    else if (d.cancelretire) { retiring = null; render(); }
    else if (d.retire) { const ch = C.characters.find((x) => x.id === d.retire); ch.status = "retired"; ch.retired = today(); addLog(C, `${ch.name} ${W("retiredOne").toLowerCase()}`);
      const un = $("rName").value.trim(); if (un) { C.unlocks.push({ id: uid("u"), kind: $("rKind").value, name: un, from: `${ch.name} (${W("retiredOne").toLowerCase()})`, date: today() }); addLog(C, `Unlocked ${$("rKind").value.toLowerCase()}: ${un}`); }
      retiring = null; save(); }
    else if (d.unretire) { const ch = C.characters.find((x) => x.id === d.unretire); ch.status = "active"; delete ch.retired; save(); }
    else if (d.delchar) { C.characters = C.characters.filter((x) => x.id !== d.delchar); save(); }
    else if (d.unlinkgoal) { const g = goalsStore(); const goal = g.goals.find((x) => x.link?.campaign === C.id && x.link?.char === d.unlinkgoal); if (goal) { delete goal.link; try { localStorage.setItem(GOALS, JSON.stringify(g)); } catch (err) {} }
      delete C.characters.find((x) => x.id === d.unlinkgoal).goalSnap; save(); }
    // camp sections
    else if (d.week) { C.calendar.week = num(C.calendar.week + Number(d.week), 1, C.schema.sections.find((s) => s.type === "calendar").weeks); weekSel = null; if (Number(d.week) > 0) addLog(C, `Week ${C.calendar.week} began`); save(); }
    else if (d.wk) { weekSel = Number(d.wk); render(); $("wkNote")?.focus(); }
    else if (d.addbld) { const sec = C.schema.sections.find((x) => x.id === d.addbld), sid = sec.id, n = $(`bName-${sid}`).value.trim(); if (!n) return $(`bName-${sid}`).focus();
      listOf(sec).push({ id: uid("b"), num: $(`bNum-${sid}`)?.value.trim() || "", name: n, level: $(`bLvl-${sid}`) ? num($(`bLvl-${sid}`).value, 0, 9) : null, state: sec.states[0] }); addLog(C, `${sec.item ? sec.item[0].toUpperCase() + sec.item.slice(1) : "Building"}: ${n}`); save(); $(`bName-${sid}`)?.focus(); }
    else if (d.delbld) { const [sid, id] = d.delbld.split(":"), sec = C.schema.sections.find((x) => x.id === sid), l = listOf(sec); l.splice(l.findIndex((x) => x.id === id), 1); save(); }
    else if (b.id === "logEvent") { const sec = C.schema.sections.find((x) => x.type === "events"), num_ = $("evNum").value.trim(), outcome = $("evOutcome").value.trim();
      if (!num_ && !outcome) return $("evNum").focus();
      const e = { id: uid("e"), kind: $("evKind").value, season: $("evSeason")?.value || "", num: num_, choice: $("evChoice").value, outcome, fate: $("evFate").value, scen: $("evScen")?.value || "", week: C.schema.sections.some((x) => x.type === "calendar") ? C.calendar.week : null, date: today() };
      (C.events = C.events || []).unshift(e); addLog(C, `${e.kind} event${e.num ? ` ${e.num}` : ""}${e.choice ? ` (chose ${e.choice})` : ""}${e.fate === sec.fates[1] ? ", removed" : ""}`); save(); $("evNum")?.focus(); }
    else if (d.delevent) { C.events = C.events.filter((x) => x.id !== d.delevent); save(); }
    else if (d.evfilter) { evFilter = d.evfilter; render(); }
    else if (d.rot) { C.rotation = (C.rotation || 0) + Number(d.rot); save(); }
    // achievements, unlocks
    else if (d.addach) { const el = $(`aNew-${d.addach}`), n = el.value.trim(); if (!n) return el.focus(); C.achievements.push({ id: uid("a"), list: d.addach, name: n, done: false }); save(); $(`aNew-${d.addach}`).focus(); }
    else if (d.delach) { C.achievements = C.achievements.filter((x) => x.id !== d.delach); C.scenarios.forEach((s) => { s.requires = (s.requires || []).filter((r) => r.ach !== d.delach); }); save(); }
    else if (b.id === "addUnlock") { const n = $("uName").value.trim(); if (!n) return $("uName").focus(); C.unlocks.push({ id: uid("u"), kind: $("uKind").value, name: n, from: $("uFrom").value.trim(), date: today() }); addLog(C, `Unlocked ${$("uKind").value.toLowerCase()}: ${n}`); save(); $("uName").focus(); }
    else if (d.delunlock) { C.unlocks = C.unlocks.filter((x) => x.id !== d.delunlock); save(); }
    // setup
    else if (b.id === "addCf") { const l = $("cfLabel").value.trim(); if (!l) return $("cfLabel").focus(); const type = $("cfType").value, extra = $("cfExtra").value.trim();
      const f = { id: uid("f"), label: l, type }; if (type === "number") f.def = 0; if (type === "checks") f.count = num(extra || 5, 1, 40); if (type === "resources") { f.names = extra.split(",").map((x) => x.trim()).filter(Boolean); if (!f.names.length) return $("cfExtra").focus(); }
      C.schema.charFields.push(f); save(); }
    else if (d.delcf) { C.schema.charFields.splice(Number(d.delcf), 1); save(); }
    else if (b.id === "addTr") { const l = $("trLabel").value.trim(); if (!l) return $("trLabel").focus(); let sec = C.schema.sections.find((s) => s.type === "tracks"); if (!sec) { sec = { id: "tracks", label: "Campaign tracks", type: "tracks", items: [] }; C.schema.sections.unshift(sec); }
      const t = { id: uid("t"), label: l, def: 0 }; if ($("trMin").value !== "") t.min = Number($("trMin").value); if ($("trMax").value !== "") t.max = Number($("trMax").value); sec.items.push(t); C.tracks[t.id] = t.min > 0 ? t.min : 0; save(); }
    else if (d.deltr) { C.schema.sections.find((s) => s.type === "tracks").items.splice(Number(d.deltr), 1); save(); }
    else if (b.id === "addList") { const l = $("listLabel").value.trim(); if (!l) return $("listLabel").focus(); C.schema.lists.push({ id: uid("l"), label: l, scope: "campaign" }); save(); }
    else if (d.dellist) { C.schema.lists.splice(Number(d.dellist), 1); save(); }
    else if (b.id === "saveTpl") { const n = $("tplName").value.trim() || C.name; const t = { id: uid("tpl"), name: n, game: C.game, icon: C.icon, blurb: `Your saved setup from “${C.name}”.`, ...copy(C.schema) };
      DB.templates[t.id] = t; persist(); msg = `Saved “${n}” as a template. It's under Start a campaign.`; render(); setTimeout(() => { msg = ""; }, 4000); }
    else if (b.id === "startBackup") startBackup();
    else if (b.id === "toggleCode") { showCode = !showCode; render(); }
    else if (b.id === "stopBackup") { delete C.code; delete C.syncedAt; delete C.dirty; persist(); msg = "Stopped backing up. The online copy stays until it's overwritten; this device won't use it."; render(); }
    else if (d.copy) navigator.clipboard.writeText(d.copy).then(() => { $("setupMsg").textContent = "Copied!"; }, () => { $("setupMsg").textContent = d.copy; });
    else if (b.id === "export") { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(payload(C), null, 2)], { type: "application/json" })); a.download = `${C.name.replace(/[^\w ]+/g, "").trim() || "campaign"}.json`; a.click(); }
    else if (b.id === "delCamp") { confirmDel = true; render(); $("delNo").focus(); }
    else if (b.id === "delNo") { confirmDel = false; render(); }
    else if (b.id === "delYes") { delete DB.campaigns[C.id]; persist(); location.href = "/tools/campaigns"; }
  });
  document.addEventListener("change", (e) => {
    const t = e.target, d = t.dataset;
    if (t.id === "tplPick") { pick = t.value; const tp = T[pick] || DB.templates[pick]; const nm = $("newName").value; render(); $("newName").value = nm; $("newGame").value = tp?.game || ""; $("tplPick").focus(); return; }
    if (!C) return;
    if (d.num) setNum(d.num, t.value);
    else if (d.sedit) { const [sid, k] = d.sedit.split(":"), s = C.scenarios.find((x) => x.id === sid);
      if (k === "unlocks") s.unlocks = t.value.split(/[,\s]+/).map((x) => x.trim()).filter(Boolean); else s[k] = t.value; if (k === "status" && t.value === "done") addLog(C, `${W("scenario")} ${s.num} marked done`); save(k === "status" || k === "unlocks"); }
    else if (d.ctext) { const [, cid, fid] = d.ctext.split(":"), ch = C.characters.find((x) => x.id === cid); ch.fields = ch.fields || {}; ch.fields[fid] = t.value; save(false); }
    else if (d.bstate) { const [sid, id] = d.bstate.split(":"), b = listOf(C.schema.sections.find((x) => x.id === sid)).find((x) => x.id === id); b.state = t.value; addLog(C, `${b.name}: ${t.value}`); save(false); }
    else if (d.trtext) { C.tracks[d.trtext] = t.value.trim(); save(); }
    else if (d.achdone) { const a = C.achievements.find((x) => x.id === d.achdone); a.done = t.checked; a.date = t.checked ? today() : null; if (t.checked) addLog(C, `Achievement: ${a.name}`); save(); }
    else if (d.wknote) { const w = Number(d.wknote); if (t.value.trim()) C.calendar.notes[w] = t.value.trim(); else delete C.calendar.notes[w]; save(); }
    else if (d.linkgoal) { const g = goalsStore(), goal = g.goals.find((x) => x.id === t.value); if (!goal) return; goal.link = { campaign: C.id, char: d.linkgoal, campaignName: C.name, charName: C.characters.find((x) => x.id === d.linkgoal).name };
      try { localStorage.setItem(GOALS, JSON.stringify(g)); } catch (err) {} save(); }
    else if (t.id === "partyName") { C.partyName = t.value.trim(); save(); }
    else if (d.cset) { if (d.cset === "unlockKinds") C.schema.unlockKinds = t.value.split(",").map((x) => x.trim()).filter(Boolean); else C[d.cset] = t.value.trim() || C[d.cset]; save(); }
    else if (t.id === "retOn") { C.schema.retirement = t.checked; save(); }
    else if (t.id === "goalsOn") { C.schema.goals = t.checked; save(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
    const id = e.target.id, d = e.target.dataset;
    const go = { evNum: "logEvent", evOutcome: "logEvent", sNum: "addScen", sName: "addScen", chName: "addChar", chClass: "addChar", chPlayer: "addChar", bName: "addBld", uName: "addUnlock", uFrom: "addUnlock", cfLabel: "addCf", trLabel: "addTr", listLabel: "addList", openCode: "openBtn" }[id];
    if (go) { e.preventDefault(); $(go).click(); } else if (d.bname) { e.preventDefault(); document.querySelector(`[data-addbld="${d.bname}"]`).click(); } else if (d.anew) { e.preventDefault(); document.querySelector(`[data-addach="${d.anew}"]`).click(); } else if (d.num) { e.preventDefault(); e.target.blur(); }
  });

  async function startBackup() {
    msg = "Making a code…"; render();
    try { const r = await ShelfSync.put(null, "campaign", payload(C)); C.code = r.code; C.syncedAt = r.updatedAt; C.dirty = false; showCode = true; msg = "Backed up. Use this code to open the campaign on another device."; persist(); }
    catch (e) { msg = "Couldn't reach the backup service. Check your connection and try again."; }
    render();
  }
  async function openCode(raw) {
    const code = ShelfSync.clean(raw); if (code.length !== 6) { msg = "Codes are 6 letters and numbers."; return render(); }
    msg = "Opening…"; render();
    try {
      const r = await ShelfSync.get(code, "campaign"); if (!r) { msg = `No campaign backed up under ${code}.`; return render(); }
      const existing = Object.values(DB.campaigns).find((c) => c.code === code || c.id === r.data.id);
      const c = Object.assign(existing || {}, r.data, { code, syncedAt: r.updatedAt, dirty: false }); c.id = existing?.id || r.data.id || uid("c");
      DB.campaigns[c.id] = c; persist(); location.href = `/tools/campaigns?c=${encodeURIComponent(c.id)}`;
    } catch (e) { msg = "Couldn't reach the backup service. Check your connection and try again."; render(); }
  }

  // Keep each character's goal snapshot current, so it travels with the campaign's backup.
  function syncGoalSnaps() {
    if (!C) return; let changed = false;
    for (const ch of C.characters) { const g = linkedGoal(ch); if (!g) continue; const snap = { id: g.id, title: g.title, pct: goalPct(g), done: goalPct(g) >= 100 };
      if (JSON.stringify(snap) !== JSON.stringify(ch.goalSnap)) { ch.goalSnap = snap; changed = true; } }
    if (changed) save(false);
  }
  addEventListener("storage", (e) => { if (e.key === GOALS && C) { syncGoalSnaps(); render(); } });

  // Campaigns started from a setup before it gained a section get the new section added.
  for (const c of Object.values(DB.campaigns)) {
    const tpl = T[c.template]; if (!tpl) continue;
    for (const [i, sec] of tpl.sections.entries()) if (!c.schema.sections.some((x) => x.id === sec.id)) { c.schema.sections.splice(Math.min(i, c.schema.sections.length), 0, copy(sec)); c.updated = Date.now(); if (c.code) c.dirty = true; persist(); }
  }
  /* ---------- Start ---------- */
  if (CID && !C) { $("app").innerHTML = `<section class="card"><p class="empty">That campaign isn't on this device. <a href="/tools/campaigns">See your campaigns</a></p></section>`; }
  else { syncGoalSnaps(); render(); pull(); }
  fetch("/api/collection").then((r) => r.json()).then((d) => {
    const names = (d.games || []).filter((g) => g.type === "Base game" && (g.mechanics || []).some((m) => /Campaign|Legacy/.test(m))).map((g) => g.name).sort();
    const dl = document.createElement("datalist"); dl.id = "campaignGames"; dl.innerHTML = names.map((n) => `<option value="${esc(n)}">`).join(""); document.body.appendChild(dl);
  }).catch(() => {});
})();
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
