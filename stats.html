<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelf Charts</title>
<meta name="description" content="Charts about our board game collection.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#fff3e2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1528" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Shelf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff3e2; --surface: #fffdf8; --surface-2: #fdeedb; --ink: #3d2a4f; --ink-2: #6b5878; --muted: #9b8aa5;
    --line: #efdcc2; --outline: #3d2a4f; --accent: #ff7a5a; --accent-ink: #ffffff; --accent-soft: #ffe2d8;
    --yellow: #ffd45c; --yellow-soft: #fff1c2; --mint: #8be0bd; --mint-soft: #ddf6ea; --remy: #ec6f24; --jon: #2385d1;
    --star: #f4a900; --ok: #24a26b; --danger: #e5484d; --danger-soft: #ffe3e2;
    --edge: 2.5px solid var(--outline); --pop: 4px 4px 0 var(--outline); --pop-sm: 3px 3px 0 var(--outline);
    /* Chart colors (validated: categorical for type, one-hue ramp for ordered levels) */
    --s1: #ff7a5a; --s2: #2a78d6; --s3: #1baf7a;
    --o1: #b398f6; --o2: #9270ec; --o3: #7049d9; --o4: #4d27a6;
    --grid: #efdcc2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1528; --surface: #2a2039; --surface-2: #342846; --ink: #fff3e2; --ink-2: #d8c8e0; --muted: #a795b3;
      --line: #46375a; --outline: #0c0714; --accent: #ff8f73; --accent-ink: #1c1528; --accent-soft: #4a2b2a;
      --yellow: #ffd45c; --yellow-soft: #4a3d1e; --mint: #6fd3ac; --mint-soft: #1f3d33; --remy: #ffa064; --jon: #6ab9f2;
      --star: #ffd45c; --ok: #6fd3ac; --danger: #ff8a80; --danger-soft: #3a1d1a; --hl: #6b44c9;
      --s1: #e8613f; --s2: #3987e5; --s3: #199e70;
      --o1: #6e52c4; --o2: #8f72e2; --o3: #b097f3; --o4: #d3c4ff;
      --grid: #3d304f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1528; --surface: #2a2039; --surface-2: #342846; --ink: #fff3e2; --ink-2: #d8c8e0; --muted: #a795b3;
    --line: #46375a; --outline: #0c0714; --accent: #ff8f73; --accent-ink: #1c1528; --accent-soft: #4a2b2a;
    --yellow: #ffd45c; --yellow-soft: #4a3d1e; --mint: #6fd3ac; --mint-soft: #1f3d33; --remy: #ffa064; --jon: #6ab9f2;
    --star: #ffd45c; --ok: #6fd3ac; --danger: #ff8a80; --danger-soft: #3a1d1a; --hl: #6b44c9;
    --s1: #e8613f; --s2: #3987e5; --s3: #199e70;
    --o1: #6e52c4; --o2: #8f72e2; --o3: #b097f3; --o4: #d3c4ff;
    --grid: #3d304f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; color: var(--ink); font: 16px/1.5 Nunito, ui-rounded, ui-sans-serif, system-ui, sans-serif;
    background-color: var(--bg); background-image: radial-gradient(circle, color-mix(in srgb, var(--outline) 9%, transparent) 1.3px, transparent 1.7px); background-size: 22px 22px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

  /* Header (matches the shelf page) */
  header.top { padding: 36px 0 8px; }
  .titlebar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  .brand { display: flex; align-items: center; gap: 16px; color: inherit; text-decoration: none; }
  .logo { width: 72px; height: 72px; flex: none; transform: rotate(-5deg); filter: drop-shadow(4px 4px 0 var(--outline)); transition: transform .3s; }
  .logo:hover { transform: rotate(4deg) scale(1.05); }
  h1 { font: 700 clamp(2rem, 4vw, 2.9rem)/1.05 Fredoka, ui-rounded, system-ui, sans-serif; margin: 0; letter-spacing: -0.01em; }
  h1 .hl { background: linear-gradient(transparent 62%, var(--hl, var(--yellow)) 62% 92%, transparent 92%); padding: 0 2px; }
  .tagline { margin: 6px 0 0; color: var(--ink-2); font-size: 1.05rem; font-weight: 600; }
  .pagenav { display: inline-flex; gap: 4px; padding: 3px; background: var(--surface); border: var(--edge); border-radius: 14px; box-shadow: var(--pop-sm); }
  .pagenav a { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 10px; font: 600 .98rem Fredoka, ui-rounded, sans-serif; color: var(--ink-2); text-decoration: none; }
  .pagenav a:hover { color: var(--ink); background: var(--surface-2); }
  .pagenav a[aria-current="page"] { background: var(--yellow); color: #3d2a4f; box-shadow: inset 0 0 0 2px var(--outline); }
  .headright { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .sync { display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--ink-2); font-weight: 600;
    background: var(--surface); border: var(--edge); box-shadow: var(--pop-sm); border-radius: 999px; padding: 6px 14px 6px 10px; }
  .sync .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .sync[data-state="syncing"] .dot { background: var(--star); }
  .sync[data-state="error"] .dot { background: var(--danger); }
  .banner { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; padding: 12px 16px; border-radius: 16px; border: var(--edge); box-shadow: var(--pop);
    background: var(--yellow-soft); font-size: .95rem; font-weight: 600; }

  /* Filters */
  .filterbar { position: sticky; top: 0; z-index: 20; margin-top: 22px; padding: 12px 0; background: var(--bg); }
  .filterbar.stuck { border-bottom: 2.5px dashed var(--line); }
  .frow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field > span { font: 600 .75rem Fredoka, ui-rounded, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
  select, input[type=text] { height: 40px; border: var(--edge); border-radius: 12px; box-shadow: var(--pop-sm); background: var(--surface); font-weight: 700; padding: 0 10px; min-width: 0; }
  select.set { background: var(--yellow-soft); }
  select:focus, input[type=text]:focus { outline: none; box-shadow: 0 0 0 4px var(--yellow), 3px 3px 0 4px var(--outline); }
  .fcount { margin-left: auto; align-self: center; font-weight: 700; color: var(--ink-2); }
  .fcount b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .linkbtn { border: 0; background: none; color: var(--accent); font-weight: 800; padding: 4px 2px; font-size: .92rem; }
  .linkbtn:hover { text-decoration: underline; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border: var(--edge); border-radius: 14px; box-shadow: var(--pop-sm);
    background: var(--accent); color: #fff; font: 600 1rem Fredoka, ui-rounded, sans-serif; transition: transform .12s, box-shadow .12s; text-decoration: none; }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--outline); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--outline); }
  .btn.ghost { background: var(--surface); color: var(--ink); }

  /* Tiles */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 8px 0 8px; }
  .tile { background: var(--surface); border: var(--edge); border-radius: 18px; box-shadow: var(--pop); padding: 14px 16px; }
  .tile dt { font: 600 .78rem Fredoka, ui-rounded, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
  .tile dd { margin: 2px 0 0; font: 700 2rem/1.1 Fredoka, ui-rounded, sans-serif; font-variant-numeric: tabular-nums; }
  .tile dd small { font-size: .95rem; font-weight: 600; color: var(--ink-2); }

  /* Sections and chart cards */
  h2.sec { font: 700 1.5rem/1.2 Fredoka, ui-rounded, sans-serif; margin: 34px 0 4px; display: flex; align-items: center; gap: 10px; }
  h2.sec .dot { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--outline); background: var(--yellow); transform: rotate(-10deg); }
  .secnote { margin: 0 0 14px; color: var(--ink-2); font-weight: 600; }
  .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .charts .wide { grid-column: 1 / -1; }
  .card { background: var(--surface); border: var(--edge); border-radius: 20px; box-shadow: var(--pop); padding: 16px 18px 12px; min-width: 0; display: flex; flex-direction: column; }
  .chead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 12px; }
  .card h3 { margin: 0; font: 600 1.15rem/1.25 Fredoka, ui-rounded, sans-serif; }
  .card .sub { margin: 2px 0 0; color: var(--ink-2); font-size: .88rem; font-weight: 600; }
  .seg { display: inline-flex; background: var(--surface-2); border: 2px solid var(--outline); border-radius: 12px; padding: 2px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: none; height: 28px; padding: 0 10px; border-radius: 9px; font-weight: 700; font-size: .85rem; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--yellow); color: #3d2a4f; box-shadow: inset 0 0 0 2px var(--outline); }
  .plot { position: relative; height: 290px; margin-top: 12px; }
  .plot.tall { height: auto; }
  .plot canvas { display: block; }
  .noplot { display: grid; place-items: center; height: 100%; min-height: 160px; color: var(--ink-2); font-weight: 700; text-align: center; border: 2.5px dashed var(--line); border-radius: 14px; padding: 16px; }
  details.data { margin-top: 8px; border-top: 2px dashed var(--line); padding-top: 6px; }
  details.data summary { cursor: pointer; font-weight: 800; font-size: .85rem; color: var(--accent); width: max-content; }
  .dtable { max-height: 260px; overflow: auto; margin-top: 6px; }
  .dtable table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  .dtable th, .dtable td { text-align: left; padding: 4px 8px; border-bottom: 1.5px solid var(--line); }
  .dtable th { font: 600 .75rem Fredoka, ui-rounded, sans-serif; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); position: sticky; top: 0; background: var(--surface); }
  .dtable td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .cardfoot { display: flex; gap: 6px; margin-left: auto; }
  .iconbtn { height: 30px; min-width: 30px; padding: 0 10px; border: 2px solid var(--outline); border-radius: 10px; background: var(--surface); font-weight: 700; font-size: .85rem; box-shadow: 2px 2px 0 var(--outline); }
  .iconbtn:hover { background: var(--yellow-soft); }

  /* Builder */
  .builder { background: var(--surface); border: var(--edge); border-radius: 22px; box-shadow: var(--pop); padding: 18px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; }
  .bform { display: flex; flex-direction: column; gap: 12px; }
  .bform .field select, .bform .field input { width: 100%; }
  .kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .kinds button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 6px; border: 2px solid var(--outline); border-radius: 12px; background: var(--surface); font-weight: 700; font-size: .78rem; color: var(--ink-2); }
  .kinds button svg { color: var(--ink); }
  .kinds button[aria-pressed="true"] { background: var(--yellow); color: #3d2a4f; box-shadow: 2px 2px 0 var(--outline); }
  .kinds button[aria-pressed="true"] svg { color: #3d2a4f; }
  .bsave { display: flex; gap: 8px; border-top: 2px dashed var(--line); padding-top: 12px; }
  .bsave input { flex: 1; }
  .bnote { margin: 0; font-size: .82rem; color: var(--ink-2); font-weight: 600; min-height: 1.2em; }
  .bpreview { min-width: 0; display: flex; flex-direction: column; }
  .bpreview h3 { margin: 0; font: 600 1.15rem Fredoka, ui-rounded, sans-serif; }
  .bpreview .plot { height: 360px; flex: none; }
  .saved-empty { color: var(--ink-2); font-weight: 600; border: 2.5px dashed var(--line); border-radius: 18px; padding: 18px; text-align: center; }

  .hint { margin: 6px 0 0; color: var(--ink-2); font-weight: 700; font-size: .92rem; }
  .cellbtn { all: unset; cursor: pointer; color: var(--accent); font-weight: 800; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 2px; }
  .cellbtn:focus-visible { outline: 2px solid var(--accent); border-radius: 3px; }
  th .cellbtn { color: var(--ink); text-decoration-color: var(--line); }
  .dtable a { color: var(--ink); font-weight: 700; }
  .drill { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgb(40 25 55 / .55); }
  .dsheet { width: min(640px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; background: var(--surface); border: 3px solid var(--outline);
    border-radius: 24px; box-shadow: 8px 8px 0 var(--outline); animation: rise .2s ease; overflow: hidden; }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } }
  .dhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 12px; border-bottom: 2.5px dashed var(--line); }
  .dhead h2 { margin: 0; font: 700 1.35rem/1.2 Fredoka, ui-rounded, sans-serif; }
  .dhead .sub { margin: 2px 0 0; color: var(--ink-2); font-weight: 700; font-size: .9rem; }
  .dclose { flex: none; width: 38px; height: 38px; border-radius: 50%; border: var(--edge); background: var(--surface); box-shadow: var(--pop-sm); font-size: 1.3rem; line-height: 1; font-weight: 800; }
  .dlist { list-style: none; margin: 0; padding: 8px 12px 14px; overflow: auto; }
  .dlist li { display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 12px; }
  .dlist li:hover { background: var(--surface-2); }
  .dthumb { width: 44px; height: 44px; flex: none; border: 2px solid var(--outline); border-radius: 9px; overflow: hidden; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--yellow-soft), var(--accent-soft)); }
  .dthumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .dinfo { min-width: 0; }
  .dinfo a { color: var(--ink); font: 600 1.02rem/1.25 Fredoka, ui-rounded, sans-serif; text-decoration: none; }
  .dinfo a:hover { color: var(--accent); text-decoration: underline; }
  .dmeta { color: var(--ink-2); font-size: .82rem; font-weight: 700; }
  @media (max-width: 760px) { .drill { padding: 0; place-items: end stretch; } .dsheet { max-height: 88vh; border-radius: 22px 22px 0 0; border-width: 3px 0 0; box-shadow: none; } }
  .ptiles { margin: 0 0 16px; }
  .tile dd.sm { font-size: 1.3rem; line-height: 1.2; } .tile dd.sm small { font-size: .95rem; }
  .plegend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-weight: 700; font-size: .85rem; color: var(--ink); }
  .plegend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--outline); margin-right: 6px; vertical-align: -1px; }
  .plmore { align-self: flex-start; margin-top: 4px; }

  /* Gaming Wrapped */
  .wrpick { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; margin-bottom: 14px; }
  .wrpick .seg small { font-weight: 700; opacity: .7; margin-left: 2px; }
  .wrapped { border: 3px solid var(--outline); border-radius: 28px; box-shadow: 8px 8px 0 var(--outline); padding: 22px; color: #fff8ee;
    background: radial-gradient(circle at 15% 10%, #ff9a6b 0, transparent 40%), radial-gradient(circle at 90% 20%, #8656ec 0, transparent 45%), radial-gradient(circle at 60% 100%, #2385d1 0, transparent 50%), #3d2a4f; }
  .wrempty { padding: 30px; text-align: center; font-weight: 800; font-size: 1.1rem; }
  .wrhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 16px; }
  .wrbadge { background: var(--yellow); color: #3d2a4f; border: 2px solid #0c0714; border-radius: 999px; padding: 3px 12px; font: 600 .9rem Fredoka, ui-rounded, sans-serif; box-shadow: 2px 2px 0 #0c0714; }
  .wrhead h3 { margin: 0; font: 700 clamp(1.8rem, 4vw, 2.8rem)/1.05 Fredoka, ui-rounded, sans-serif; }
  .wrstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .wrstat { border: 2.5px solid #0c0714; border-radius: 20px; padding: 14px 16px; box-shadow: 3px 3px 0 #0c0714; color: #3d2a4f; display: grid; }
  .wrstat b { font: 700 clamp(2rem, 4.5vw, 3rem)/1 Fredoka, ui-rounded, sans-serif; font-variant-numeric: tabular-nums; }
  .wrstat span { font-weight: 800; font-size: .9rem; }
  .wrstat.s1 { background: #ffd45c; transform: rotate(-1.5deg); } .wrstat.s2 { background: #8be0bd; transform: rotate(1deg); }
  .wrstat.s3 { background: #ffb3c9; transform: rotate(-.8deg); } .wrstat.s4 { background: #b7d8ff; transform: rotate(1.4deg); }
  .wrgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .wrcard { background: rgb(255 255 255 / .1); border: 2px solid rgb(255 255 255 / .28); border-radius: 18px; padding: 14px 16px; min-width: 0; }
  .wrcard.wrwide { grid-column: 1 / -1; }
  .wrcard h4 { margin: 0 0 10px; font: 600 .82rem Fredoka, ui-rounded, sans-serif; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
  .wrtop { all: unset; cursor: pointer; display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; }
  .wrtop img, .wrdie { width: 76px; height: 76px; object-fit: contain; border-radius: 12px; background: #fff8ee; border: 2px solid #0c0714; padding: 4px; flex: none; transform: rotate(-3deg); box-shadow: 3px 3px 0 #0c0714; display: grid; place-items: center; font-size: 2rem; }
  .wrtop b { display: block; font: 700 1.4rem/1.15 Fredoka, ui-rounded, sans-serif; } .wrtop small { font-weight: 700; opacity: .85; font-size: .9rem; }
  .wrtop:focus-visible, .wrlist button:focus-visible, .wrchips button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; border-radius: 8px; }
  .wrlist { margin: 12px 0 0; padding-left: 22px; display: grid; gap: 4px; font-weight: 700; }
  .wrlist li { display: list-item; } .wrlist li > * { vertical-align: middle; }
  .wrlist li span:last-child { float: right; opacity: .8; font-variant-numeric: tabular-nums; }
  .wrlist button { all: unset; cursor: pointer; } .wrlist button:hover { text-decoration: underline; }
  .wrwin { font-size: 1.05rem; margin-bottom: 6px; } .wrwin span { opacity: .8; }
  .wrbig { margin: 0 0 8px; font: 700 2rem/1 Fredoka, ui-rounded, sans-serif; } .wrbig span { font: 700 .95rem Nunito, sans-serif; }
  .wrchips { display: flex; flex-wrap: wrap; gap: 6px; } .wrchips button, .wrchips span { all: unset; cursor: pointer; font-size: .82rem; font-weight: 800; border: 1.5px solid rgb(255 255 255 / .45); border-radius: 999px; padding: 2px 10px; }
  .wrchips span { cursor: default; opacity: .8; }
  .wrnote { margin: 6px 0 0; font-size: .85rem; font-weight: 600; opacity: .85; }
  .wrfacts { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-weight: 600; }
  .wrapped .plot { margin-top: 0; background: var(--surface); border-radius: 12px; padding: 8px; }
  @media (max-width: 760px) {
    .wrapped { padding: 16px; border-radius: 22px; box-shadow: 4px 4px 0 var(--outline); }
    .wrstats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .wrstat { padding: 10px; } .wrstat span { font-size: .78rem; } .wrgrid { grid-template-columns: 1fr; }
  }
  footer { margin: 48px 0 0; padding: 26px 0 40px; border-top: 2.5px dashed var(--line); color: var(--muted); font-size: .88rem; font-weight: 600;
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
  .bgg { display: inline-block; background: #fff; border: var(--edge); box-shadow: var(--pop-sm); border-radius: 12px; padding: 6px 10px; line-height: 0; }
  .bgg img { width: 200px; height: auto; }
  .loading { padding: 60px 0; text-align: center; font-weight: 700; color: var(--ink-2); }

  @media (max-width: 1000px) {
    .builder { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* ---------- Helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(key, fallback) { try { const v = localStorage.getItem("game-shelf:" + key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem("game-shelf:" + key, JSON.stringify(value)); } catch {} },

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = (n, d = 0) => n == null || Number.isNaN(n) ? "—" : n.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const avg = (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const median = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const num = (v) => (v == null || v === "" || Number.isNaN(Number(v)) ? null : Number(v));
const TEN = 10;

/* ---------- What a game looks like to the charts ---------- */
const playTime = (g) => g.playTime || g.maxTime || g.minTime || null;
const WBANDS = [["light", "Light", (w) => w < 2], ["medium", "Medium", (w) => w >= 2 && w < 3], ["mheavy", "Medium-heavy", (w) => w >= 3 && w < 3.8], ["heavy", "Heavy", (w) => w >= 3.8]];
const TBANDS = [["short", "Up to 30 min", (t) => t <= 30], ["hour", "31–60 min", (t) => t > 30 && t <= 60], ["long", "1–2 hours", (t) => t > 60 && t <= 120], ["epic", "Over 2 hours", (t) => t > 120]];
const TBINS = [[15, "≤ 15"], [30, "16–30"], [45, "31–45"], [60, "46–60"], [90, "61–90"], [120, "91–120"], [180, "2–3 hrs"], [Infinity, "3+ hrs"]];

const TOP = 15;
const topOrder = (key) => (list) => {
  const c = new Map(); for (const g of list) for (const v of g[key] || []) c.set(v, (c.get(v) || 0) + 1);
  return [...c].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, TOP).map(([k]) => k);
};
const present = (fn, sorter) => (list) => { const s = new Set(); for (const g of list) for (const v of fn(g)) s.add(v); return [...s].sort(sorter); };
const DIMS = {
  decade: { label: "Decade published", values: (g) => decadeOf(g) ? [decadeOf(g)] : [], order: present((g) => decadeOf(g) ? [decadeOf(g)] : [], (a, b) => (a.startsWith("Before") ? -1 : b.startsWith("Before") ? 1 : byNum(a, b))) },
  year: { label: "Year published", values: (g) => yearOf(g) ? [String(yearOf(g))] : [], order: present((g) => yearOf(g) ? [String(yearOf(g))] : [], (a, b) => a - b) },
  weightStep: { label: "Complexity (in half steps)", values: (g) => g.weight ? [halfStep(g.weight, 1, 5)] : [], order: () => halfSteps(1, 5) },
  weightBand: { label: "Complexity level", values: (g) => wband(g) ? [wband(g)] : [], order: () => WBANDS.map((x) => x[1]), ordinal: true },
  timeBin: { label: "Play time", values: (g) => playTime(g) ? [TBINS.find(([max]) => playTime(g) <= max)[1]] : [], order: () => TBINS.map((x) => x[1]) },
  timeBand: { label: "Play time band", values: (g) => tband(g) ? [tband(g)] : [], order: () => TBANDS.map((x) => x[1]), ordinal: true },
  best: { label: "Best player count", values: (g) => [...new Set((g.bestPlayers || []).map(bestKey))], order: () => BEST_KEYS },
  maxPlayers: { label: "Most players", values: (g) => g.maxPlayers ? [bestKey(g.maxPlayers)] : [], order: () => BEST_KEYS },
  minPlayers: { label: "Fewest players", values: (g) => g.minPlayers ? [bestKey(g.minPlayers)] : [], order: () => BEST_KEYS.slice(0, 6) },
  rating: { label: "BGG rating (in half steps)", values: (g) => g.rating ? [halfStep(g.rating, 5, 9)] : [], order: () => halfSteps(5, 9) },
  type: { label: "Type", values: (g) => [g.type], order: () => ["Base game", "Expansion", "Accessory"] },
  mechanics: { label: "Mechanics", values: (g) => g.mechanics || [], order: topOrder("mechanics"), top: true, multi: true },
  categories: { label: "Categories", values: (g) => g.categories || [], order: topOrder("categories"), top: true, multi: true },
  designers: { label: "Designers", values: (g) => g.designers || [], order: topOrder("designers"), top: true, multi: true },
  publishers: { label: "Publishers", values: (g) => g.publishers || [], order: topOrder("publishers"), top: true, multi: true },

  count: { label: "Number of games", short: "Games", get: null, d: 0 },
  rating: { label: "Average BGG rating", short: "Avg rating", get: (g) => g.rating, d: 2 },

const SPLITS = {
  none: { label: "Nothing" },

  weightBand: { label: "Complexity level", of: wband, keys: WBANDS.map((x) => x[1]), colors: ["--o1", "--o2", "--o3", "--o4"] },
  timeBand: { label: "Play time band", of: tband, keys: TBANDS.map((x) => x[1]), colors: ["--o1", "--o2", "--o3", "--o4"] },

const NUMS = {
  weight: { label: "Complexity", get: (g) => g.weight, d: 1 },
  time: { label: "Play time (minutes)", get: playTime, log: true, d: 0 },
  rating: { label: "BGG rating", get: (g) => g.rating, d: 1 },
  year: { label: "Year published", get: yearOf, d: 0, plain: true },
  rank: { label: "BGG rank", get: (g) => g.rank, log: true, d: 0, reverse: true },
  votes: { label: "Rating votes", get: (g) => g.votes || null, log: true, d: 0 },
  maxPlayers: { label: "Most players", get: (g) => g.maxPlayers, d: 0 },

const KINDS = {
  bar: { label: "Bars", icon: '<path d="M5 20V11M10 20V5M15 20V9M20 20V14" stroke-width="3" stroke-linecap="round"/>' },
  hbar: { label: "Sideways", icon: '<path d="M4 5h9M4 10h15M4 15h7M4 20h12" stroke-width="3" stroke-linecap="round"/>' },
  line: { label: "Line", icon: '<path d="M3 18l5-6 4 3 8-10" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>' },
  scatter: { label: "Dots", icon: '<circle cx="6" cy="16" r="2.4"/><circle cx="11" cy="9" r="2.4"/><circle cx="16" cy="14" r="2.4"/><circle cx="19" cy="6" r="2.4"/>' },

/* ---------- Data and filters ---------- */
let all = [], updatedAt = null;
const F = { include: "base", best: "", weight: "", time: "", decade: "" };
function filtered() {
  return all.filter((g) => {
    if (F.include === "base" && g.type !== "Base game") return false;
    if (F.include === "exp" && g.type === "Accessory") return false;
    if (F.best && !(g.bestPlayers || []).some((n) => bestKey(n) === F.best)) return false;
    if (F.weight && wband(g) !== F.weight) return false;
    if (F.time && tband(g) !== F.time) return false;
    if (F.decade && decadeOf(g) !== F.decade) return false;
    return true;

// Turn games into chart series for a bar/line chart.
function aggregate(list, { dim, measure = "count", split = "none" }) {
  const D = DIMS[dim], M = MEASURES[measure], S = SPLITS[split];

  const keys = S.keys || [null];

  for (const g of list) {
    const sk = S.of ? S.of(g) : null, si = S.of ? keys.indexOf(sk) : 0;
    if (si < 0) continue;

  }
  const val = (gs) => M.get ? avg(gs.map(M.get).filter((x) => x != null)) : gs.length;

  return { labels, series, stacked: measure === "count" && series.length > 1 };
}
function scatterData(list, { x, y, color = "none" }) {
  const S = SPLITS[color], keys = S.keys || [null];
  const series = keys.map((k, i) => ({ name: k || "Games", color: S.colors ? S.colors[i] : "--s1", shape: ["circle", "triangle", "rectRounded", "rectRot"][i], data: [] }));
  for (const g of list) {
    const xv = NUMS[x].get(g), yv = NUMS[y].get(g); if (xv == null || yv == null) continue;
    const si = S.of ? keys.indexOf(S.of(g)) : 0; if (si < 0) continue;
    series[si].data.push({ x: xv, y: yv, name: g.name, g });
  }

}

/* ---------- Drawing ---------- */
const charts = new Map(), drillCells = new Map();

/* ---------- The games behind a bar or dot ---------- */
let drillReturn = null;
function openDrill(title, sub, games) {
  games = [...games].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));
  drillReturn = document.activeElement;
  const time = (g) => playTime(g) ? `${playTime(g)} min` : "";
  const d = $("drill");
  d.innerHTML = `<div class="dsheet" role="document">
    <div class="dhead"><div><h2 id="drill-h">${esc(title)}</h2><p class="sub">${games.length} ${games.length === 1 ? "game" : "games"}${sub ? ` · ${esc(sub)}` : ""}</p></div>
      <button class="dclose" id="drill-close" aria-label="Close">×</button></div>
    <ul class="dlist">${games.map((g) => `<li>
      <span class="dthumb">${g.thumbnail ? `<img src="${esc(g.thumbnail)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</span>
      <div class="dinfo"><a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.name)}</a>
        <div class="dmeta">${[g.year, g.type !== "Base game" && g.type, g.rating && `★ ${g.rating.toFixed(1)}`, g.weight && `Complexity ${g.weight.toFixed(1)}`, time(g), g.bestWith && g.bestWith.replace(/^Best with\s+/i, "Best ")]
          .filter(Boolean).map(esc).join(" · ")}</div></div></li>`).join("")}</ul></div>`;

function closeDrill() { $("drill").hidden = true; $("drill").innerHTML = ""; document.body.style.overflow = ""; drillReturn?.focus?.({ preventScroll: true }); drillReturn = null; }
function chartTheme() {

function draw(id, cfg, list) {

    table = { head: ["Game", X.label, Y.label, ...(r.series.length > 1 ? [SPLITS[cfg.color].label] : [])],
      rows: r.series.flatMap((s) => s.data.map((p) => [{ t: p.name, href: p.g.url }, fmt(p.x, X.d), fmt(p.y, Y.d), ...(r.series.length > 1 ? [s.name] : [])])).sort((a, b) => a[0].t.localeCompare(b[0].t)) };
    drill = (els, chart) => {
      const pts = els.map((e) => chart.data.datasets[e.datasetIndex].data[e.index]);
      const games = [...new Set(pts.map((p) => p.g))];

        games.length === 1 ? `${X.label}: ${fmt(pts[0].x, X.d)} · ${Y.label}: ${fmt(pts[0].y, Y.d)}` : "These dots sit on top of each other.", games);
    };
  } else {
    const r = aggregate(list, cfg); if (!r.labels.length || !r.series.length) return empty(box);
    const M = MEASURES[cfg.measure || "count"], horiz = kind === "hbar";
    type = kind === "line" ? "line" : "bar";
    data = { labels: r.labels, datasets: r.series.map((s) => kind === "line"
      ? { label: s.name, data: s.data, borderColor: css(s.color), backgroundColor: css(s.color), borderWidth: 2.5, pointRadius: 3.5, pointHoverRadius: 6, pointBorderColor: T.outline, pointBorderWidth: 1.2, tension: .25, spanGaps: true, n: s.n }
      : { label: s.name, data: s.data, backgroundColor: css(s.color), borderColor: T.outline, borderWidth: 1.6, borderRadius: 5, borderSkipped: r.stacked ? false : "start",
          maxBarThickness: 46, categoryPercentage: .82, barPercentage: r.series.length > 1 && !r.stacked ? .92 : .86, n: s.n }) };
    // What a bar or point is made of: its games, or every series' games in that group.

    drillCell = bucket;
    const valAxis = { ...axis(T, { label: M.label, d: M.d }), stacked: r.stacked, beginAtZero: true };
    if (cfg.measure === "count" || !cfg.measure) valAxis.ticks.precision = 0;

        return M.get ? `${pre}${fmt(v, M.d)} (${c.dataset.n[c.dataIndex]} game${c.dataset.n[c.dataIndex] === 1 ? "" : "s"})` : `${pre}${fmt(v)} game${v === 1 ? "" : "s"}`; } } } };
    if (horiz) box.style.height = Math.max(160, r.labels.length * (r.series.length > 1 && !r.stacked ? 18 * r.series.length + 8 : 26) + 70) + "px";
    table = { head: [DIMS[cfg.dim].label, ...r.series.map((s) => r.series.length > 1 ? s.name : M.short)],
      rows: r.labels.map((l, i) => [{ t: l, drill: [i, null] }, ...r.series.map((s, si) => s.data[i] == null ? "—" : { t: fmt(s.data[i], M.d), drill: [i, si] })]) };

    interaction: kind === "scatter" ? { mode: "nearest", intersect: true } : { mode: kind === "line" ? "index" : "nearest", intersect: kind !== "line", axis: kind === "hbar" ? "y" : "x" },
    plugins: { ...opts.plugins,

/* ---------- "Our 2026": the year and its quarters in plays (from Remy's logged plays) ---------- */
let LOG = null;                 // { plays: [...] } from /api/plays
const WR = { year: null, q: 0 }; // q = 0 for the whole year, 1-4 for a quarter
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DAYS = ["Sundays", "Mondays", "Tuesdays", "Wednesdays", "Thursdays", "Fridays", "Saturdays"];
const isRemy = (p) => (p.user || "").toLowerCase() === "asianofchaos" || /^remy\b/i.test(p.name || "");
const isJon = (p) => (p.user || "").toLowerCase() === "celestinpro" || /^jon(athan)?\b/i.test(p.name || "");
const qOf = (d) => Math.ceil(Number(d.slice(5, 7)) / 3);
const inPeriod = (pl, y, q) => Number(pl.date.slice(0, 4)) === y && (!q || qOf(pl.date) === q);
const periodName = (y, q) => q ? `Q${q} ${y}` : String(y);
const shelfGame = (id) => all.find((g) => g.id === id);
const hrs = (m) => m >= 600 ? fmt(m / 60) : fmt(m / 60, 1);
// Minutes for a play: what was logged, or BGG's listed time for games on our shelf.
const playMins = (pl) => pl.mins ? { m: pl.mins, est: false } : (shelfGame(pl.game)?.playTime ? { m: shelfGame(pl.game).playTime * pl.qty, est: true } : { m: 0, est: null });
function firstPlays() { const f = new Map(); for (const pl of LOG.plays) if (!f.has(pl.game) || pl.date < f.get(pl.game)) f.set(pl.game, pl.date); return f; }
function summarize(list) {

    byMonth: Array(12).fill(0), byDow: Array(7).fill(0), byDate: new Map(), longest: null };
  for (const pl of list) {
    s.plays += pl.qty;
    const g = s.games.get(pl.game) || { id: pl.game, name: pl.name, n: 0, mins: 0, wins: 0 };
    g.n += pl.qty; s.games.set(pl.game, g);
    const t = playMins(pl); if (t.est === null) s.noTime++; else { s.mins += t.m; g.mins += t.m; if (t.est) s.estMins += t.m; }
    if (!s.longest || t.m > s.longest.m) s.longest = { m: t.m, pl, est: t.est };
    if (!pl.nowin && !pl.incomplete) for (const [who, test] of [["remy", isRemy], ["jon", isJon]]) {
      const p = pl.players.find(test); if (p) { s[who].n += pl.qty; if (p.win) { s[who].w += pl.qty; if (who === "remy") g.wins += pl.qty; } }
    }
    for (const p of pl.players) if (!isRemy(p) && p.name) { const k = p.name.trim(); s.with.set(k, (s.with.get(k) || 0) + pl.qty); }
    const d = new Date(pl.date + "T12:00:00");
    s.byMonth[d.getMonth()] += pl.qty; s.byDow[d.getDay()] += pl.qty; s.byDate.set(pl.date, (s.byDate.get(pl.date) || 0) + pl.qty);
  }

}
function wrappedHtml() {
  if (!LOG?.plays?.length) return `<div class="card wide"><div class="noplot">Your Wrapped shows up after the next daily sync brings in your logged plays from BoardGameGeek.</div></div>`;
  const years = [...new Set(LOG.plays.map((p) => Number(p.date.slice(0, 4))))].sort((a, b) => b - a);
  if (!years.includes(WR.year)) WR.year = years[0];
  const y = WR.year, q = WR.q, list = LOG.plays.filter((p) => inPeriod(p, y, q)), s = summarize(list);
  const prev = q ? (q === 1 ? [y - 1, 4] : [y, q - 1]) : [y - 1, 0], ps = summarize(LOG.plays.filter((p) => inPeriod(p, prev[0], prev[1])));
  const qCounts = [1, 2, 3, 4].map((n) => LOG.plays.filter((p) => inPeriod(p, y, n)).reduce((a, p) => a + p.qty, 0));
  const picker = `<div class="wrpick"><label class="field"><span>Year</span><select id="wr-year">${years.map((v) => `<option${v === y ? " selected" : ""}>${v}</option>`).join("")}</select></label>
    <div class="seg" role="group" aria-label="Which part of ${y}"><button data-wrq="0" aria-pressed="${!q}">Whole year</button>${[1, 2, 3, 4].map((n) =>
      `<button data-wrq="${n}" aria-pressed="${q === n}">Q${n} <small>${qCounts[n - 1]}</small></button>`).join("")}</div></div>`;
  if (!s.plays) return `${picker}<div class="wrapped"><div class="wrempty">No plays logged in ${periodName(y, q)}. Pick another ${q ? "quarter" : "year"}.</div></div>`;
  const delta = ps.plays ? s.plays - ps.plays : null;
  const fresh = (() => { const f = firstPlays(); return s.top.filter((g) => inPeriod({ date: f.get(g.id) }, y, q)); })();
  const fav = s.top[0], favG = shelfGame(fav.id);
  const busiestDow = s.byDow.indexOf(Math.max(...s.byDow)), busiestDay = [...s.byDate].sort((a, b) => b[1] - a[1])[0];
  const facts = [
    `Most game nights fell on <b>${DAYS[busiestDow]}</b>.`,
    busiestDay[1] > 1 && `Biggest day: <b>${new Date(busiestDay[0] + "T12:00:00").toLocaleDateString(undefined, { month: "long", day: "numeric" })}</b>, with ${busiestDay[1]} plays.`,
    delta !== null && `That's <b>${Math.abs(delta)} ${delta >= 0 ? "more" : "fewer"}</b> plays than ${periodName(prev[0], prev[1])}.`,
  ].filter(Boolean);
  return `${picker}<div class="wrapped" aria-live="polite">
    <div class="wrhead"><h3>Our ${periodName(y, q)}</h3></div>
    <div class="wrstats">
      <div class="wrstat s1"><b>${fmt(s.plays)}</b><span>plays</span></div>
      <div class="wrstat s2"><b>${fmt(s.games.size)}</b><span>different games</span></div>
      <div class="wrstat s4"><b>${fmt(fresh.length)}</b><span>new to us</span></div>
    </div>
    <div class="wrgrid">
      <section class="wrcard wrfav"><h4>Favorite game</h4>
        <button class="wrtop" data-wrgame="${esc(fav.id)}">${favG?.thumbnail ? `<img src="${esc(favG.thumbnail)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : `<span class="wrdie" aria-hidden="true">🎲</span>`}
          <span><b>${esc(fav.name)}</b><small>played ${fav.n} time${fav.n === 1 ? "" : "s"}</small></span></button>
        <ol class="wrlist" start="2">${s.top.slice(1, 5).map((g) => `<li><button data-wrgame="${esc(g.id)}">${esc(g.name)}</button><span>${g.n}×</span></li>`).join("")}</ol></section>
      <section class="wrcard"><h4>New to us</h4>${fresh.length ? `<p class="wrbig">${fresh.length} <span>game${fresh.length === 1 ? "" : "s"} played for the first time</span></p>
        <div class="wrchips">${fresh.slice(0, 10).map((g) => `<button data-wrgame="${esc(g.id)}">${esc(g.name)}</button>`).join("")}${fresh.length > 10 ? `<span>+${fresh.length - 10} more</span>` : ""}</div>` : `<p class="wrnote">Only old favorites this time.</p>`}</section>
      <section class="wrcard wrwide"><h4>${q ? "Plays by week" : "Plays by month"}</h4><div class="plot" id="c-wrapped" style="height:200px"></div></section>
      <section class="wrcard wrwide"><h4>Fun facts</h4><ul class="wrfacts">${facts.map((f) => `<li>${f}</li>`).join("")}</ul>
</section>
    </div></div>`;
}
function renderWrapped() {
  if (!renderWrapped.jumped && location.hash === "#recap") { renderWrapped.jumped = true; setTimeout(() => $("wrapped-h")?.scrollIntoView({ block: "start" }), 0); }
  const box = $("wrapped"); if (!box) return;
  box.innerHTML = wrappedHtml();
  $("wrapped-title").textContent = WR.year ? `Our ${WR.year}` : "Our year";
  const plot = $("c-wrapped"); if (!plot) return;
  const y = WR.year, q = WR.q, list = LOG.plays.filter((p) => inPeriod(p, y, q)), T = chartTheme();
  let labels, buckets;
  if (q) { // weeks of the quarter, starting on the quarter's first day
    const start = new Date(y, (q - 1) * 3, 1), end = new Date(y, q * 3, 1), n = Math.ceil((end - start) / (7 * 864e5));
    labels = Array.from({ length: n }, (_, i) => new Date(start.getTime() + i * 7 * 864e5).toLocaleDateString(undefined, { month: "short", day: "numeric" }));
    buckets = labels.map(() => []); for (const pl of list) buckets[Math.min(n - 1, Math.floor((new Date(pl.date + "T12:00:00") - start) / (7 * 864e5)))].push(pl);
  } else { labels = MONTHS; buckets = MONTHS.map(() => []); for (const pl of list) buckets[Number(pl.date.slice(5, 7)) - 1].push(pl); }
  charts.get("c-wrapped")?.destroy();
  plot.innerHTML = `<canvas role="img" aria-label="Plays ${q ? "by week" : "by month"} in ${periodName(y, q)}. Select a bar to see the games."></canvas>`;
  charts.set("c-wrapped", new Chart(plot.querySelector("canvas"), { type: "bar",
    data: { labels, datasets: [{ label: "Plays", data: buckets.map((b) => b.reduce((a, p) => a + p.qty, 0)), backgroundColor: css("--s1"), borderColor: T.outline, borderWidth: 1.6, borderRadius: 5, borderSkipped: "start", maxBarThickness: 40 }] },
    options: { responsive: true, maintainAspectRatio: false, animation: { duration: 300 },
      scales: { x: { grid: { display: false }, border: { color: T.outline, width: 2 }, ticks: { color: T.ink2, font: { weight: 700 }, maxRotation: 0, autoSkip: true } },
        y: { ...axis(T, { label: "Plays", d: 0 }), beginAtZero: true, ticks: { ...axis(T, { d: 0 }).ticks, precision: 0 } } },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: T.surface, titleColor: T.ink, bodyColor: T.ink, borderColor: T.outline, borderWidth: 2, cornerRadius: 10, padding: 10,
        callbacks: { label: (c) => `${c.raw} play${c.raw === 1 ? "" : "s"}` } } },
      onClick: (evt, _e, chart) => { const el = chart.getElementsAtEventForMode(evt, "index", { intersect: false }, true)[0]; if (!el || !buckets[el.index].length) return;
        const s = summarize(buckets[el.index]);
        openDrill(`${q ? "Week of " : ""}${labels[el.index]}${q ? "" : ` ${y}`}`, `${s.plays} play${s.plays === 1 ? "" : "s"}`, s.top.map((g) => ({ ...wrGame(g.id, g.name), year: `${g.n}×` }))); },
      onHover: (evt, els) => { evt.native.target.style.cursor = els.length ? "pointer" : "default"; } } }));
}
const wrGame = (id, name) => shelfGame(id) || { id, name, type: "Base game", url: `https://boardgamegeek.com/boardgame/${id}` };
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.wrq !== undefined) { WR.q = Number(t.dataset.wrq); renderWrapped(); document.querySelector(`[data-wrq="${WR.q}"]`)?.focus(); }
  else if (t.dataset.wrgame) {
    const y = WR.year, q = WR.q, mine = LOG.plays.filter((p) => p.game === t.dataset.wrgame && inPeriod(p, y, q)), s = summarize(mine), g = s.top[0];
    openDrill(g.name, `${g.n} play${g.n === 1 ? "" : "s"} in ${periodName(y, q)}`, [wrGame(g.id, g.name)]);
  }
});
document.addEventListener("change", (e) => { if (e.target.id === "wr-year") { WR.year = Number(e.target.value); renderWrapped(); $("wr-year").focus(); } });

/* ---------- Events ---------- */
const FIDS = { "f-include": "include", "f-best": "best", "f-weight": "weight", "f-time": "time", "f-decade": "decade" };
document.addEventListener("change", (e) => {
  const t = e.target;
  if (FIDS[t.id]) { F[FIDS[t.id]] = t.value; store.set("chart-filters", F); renderAll(); t.focus(); return; }
  if (t.dataset.b) { B[t.dataset.b] = t.value; B = clean(B); store.set("builder", B); $("b-note").textContent = ""; renderBuilder(true); }
});
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "f-reset") { Object.assign(F, { include: "base", best: "", weight: "", time: "", decade: "" }); store.set("chart-filters", F); renderAll(); $("f-include").focus(); }
  else if (t.dataset.mode) {
    const [id, m] = t.dataset.mode.split(":"), c = DASH.find((x) => x.id === id); c.mode = m;
    t.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === t)));
    if (id === "c-tops") { c.title = `Top ${TOP} ${m}`; $(id + "-h").textContent = c.title; }
    draw(id, { ...c.cfg(m), title: c.title }, filtered());
  }
  else if (t.dataset.drill) { drillCells.get(t.dataset.drill)?.(Number(t.dataset.li), t.dataset.si === "" ? null : Number(t.dataset.si)); }
  else if (t.id === "drill-close") closeDrill();
  else if (t.dataset.kind) { B.kind = t.dataset.kind; B = clean(B); store.set("builder", B); renderBuilder(true); }
  else if (t.dataset.edit) { const c = loadCharts().find((x) => x.id === t.dataset.edit); if (!c) return;
    B = clean(c); store.set("builder", B); renderBuilder(); $("b-name").value = c.name; $("b-note").textContent = `Editing “${c.name}”. Save with the same name to update it.`;
    $("builder").scrollIntoView({ behavior: "smooth", block: "start" }); $("b-name").focus({ preventScroll: true }); }
  else if (t.dataset.del) { saveCharts(loadCharts().filter((x) => x.id !== t.dataset.del)); renderSaved(filtered()); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "bform") return;
  e.preventDefault();
  const name = $("b-name").value.trim().slice(0, 50), note = $("b-note");
  if (!name) { note.textContent = "Give the chart a name first."; $("b-name").focus(); return; }
  const list = loadCharts(), i = list.findIndex((c) => c.name.toLowerCase() === name.toLowerCase());
  if (i >= 0) { list[i] = { ...list[i], ...clean(B), name }; note.textContent = `Updated “${name}”.`; }
  else if (list.length >= SC_MAX) { note.textContent = `You can keep up to ${SC_MAX} charts. Delete one to save another.`; return; }
  else { list.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, ...clean(B) }); note.textContent = `Saved “${name}”. It's under Your charts.`; }
  saveCharts(list); $("b-name").value = ""; renderSaved(filtered());
});
$("drill").addEventListener("click", (e) => { if (e.target.id === "drill") closeDrill(); });
document.addEventListener("keydown", (e) => {
  if ($("drill").hidden) return;
  if (e.key === "Escape") closeDrill();
  else if (e.key === "Tab") { // keep focus inside the list while it's open
    const f = [...$("drill").querySelectorAll("button, a")]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
// Redraw in the other theme's colors when light/dark mode changes.
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => all.length && renderAll());
new IntersectionObserver(([e]) => $("filterbar").classList.toggle("stuck", e.intersectionRatio < 1), { threshold: [1], rootMargin: "-1px 0px 0px 0px" }).observe($("filterbar"));

/* ---------- Load ---------- */
function setSync(kind, text) { $("sync").dataset.state = kind; $("sync-label").textContent = text; }
function banner(html) { $("banner").innerHTML = html || ""; $("banner").hidden = !html; }
async function load() {
  if (!window.Chart) { setSync("error", "Couldn't load"); $("loading").textContent = "The chart library didn't load. Check your connection and refresh the page."; return; }
  Chart.defaults.font.family = "Nunito, ui-rounded, system-ui, sans-serif"; Chart.defaults.font.size = 12;
  try {
    const logReq = fetch("/api/plays").then((x) => x.ok ? x.json() : null).catch(() => null);
    const r = await fetch("/api/collection");
    const d = await r.json().catch(() => ({}));

  } catch (err) {

  }
}
